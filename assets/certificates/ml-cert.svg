<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0b0e14" />
        <stop offset="100%" stop-color="#141c2b" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e056fd" />
        <stop offset="100%" stop-color="#686de0" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    
    <!-- Background Frame -->
    <rect x="10" y="10" width="780" height="540" rx="20" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <rect x="25" y="25" width="750" height="510" rx="14" fill="none" stroke="#e056fd" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6,4" />
    
    <!-- Corner Accents -->
    <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#e056fd" stroke-width="3" />
    <path d="M 770 60 L 770 30 L 740 30" fill="none" stroke="#e056fd" stroke-width="3" />
    <path d="M 30 500 L 30 530 L 60 530" fill="none" stroke="#e056fd" stroke-width="3" />
    <path d="M 770 500 L 770 530 L 740 530" fill="none" stroke="#e056fd" stroke-width="3" />
    
    <!-- Certificate Header -->
    <text x="400" y="85" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#e056fd" letter-spacing="4">CERTIFICATE OF COMPLETION &amp; MERIT</text>
    <text x="400" y="125" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">PROUDLY PRESENTED TO</text>
    
    <!-- Recipient Name -->
    <text x="400" y="185" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#goldGrad)" letter-spacing="1.5">ADARSH GAJANAN DUTONDE</text>
    <line x1="220" y1="205" x2="580" y2="205" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Description -->
    <text x="400" y="240" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="15" fill="#a0aec0">For successfully demonstrating proficiency, technical acumen, and practical project mastery in</text>
    <text x="400" y="280" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Machine Learning Foundations</text>
    <text x="400" y="315" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="14" fill="#cbd5e1">Supervised/Unsupervised Learning & Scikit-Learn</text>
    
    <!-- Badge Seal -->
    <circle cx="400" cy="390" r="42" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="400,362 408,382 428,382 412,394 418,414 400,402 382,414 388,394 372,382 392,382" fill="#e056fd" opacity="0.9" />
    <text x="400" y="445" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="11" font-weight="600" fill="#e056fd" letter-spacing="2">VERIFIED CREDENTIAL</text>
    
    <!-- Bottom Footer Meta -->
    <line x1="80" y1="485" x2="260" y2="485" stroke="#334155" stroke-width="1.5" />
    <text x="170" y="505" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="12" fill="#94a3b8">ISSUING INSTITUTION</text>
    <text x="170" y="525" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">DeepLearning.AI / Stanford Online</text>
    
    <line x1="540" y1="485" x2="720" y2="485" stroke="#334155" stroke-width="1.5" />
    <text x="630" y="505" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="12" fill="#94a3b8">CREDENTIAL ID &amp; DATE</text>
    <text x="630" y="525" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">MLF-2026-5521 • Mar 2026</text>
